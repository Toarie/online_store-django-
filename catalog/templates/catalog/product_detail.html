{% extends 'catalog/base.html' %}

{% block content %}
    <div class="product-detail">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <h1>{{ product.name }}</h1>
        <p>{{ product.description }}</p>
        <p>Цена: {{ product.price }} руб.</p>
        <a href="{% url 'home' %}">Назад к списку товаров</a>
    </div>
{% endblock %}
