{% extends "catalog/base.html" %}
{% load my_tags %}

{% block content %}
    <h1>{{ product.name }}</h1>
    <img src="{{ product.image|media_filter }}" alt="{{ product.name }}">
    <p>{{ product.description }}</p>
    <p>Цена: {{ product.price }}</p>
    <a href="{% url 'catalog:home' %}">Назад к списку товаров</a>
{% endblock %}
