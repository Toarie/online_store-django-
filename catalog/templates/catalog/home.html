{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
    <h1>Товары</h1>

    <div class="products">
        {% for product in products %}
        <div class="product">
            <img src="{{ product.image | media_filter }}" alt="{{ product.name }}">
            <h2><a href="#">{{ product.name }}</a></h2>
            <p class="description">{{ product.description|truncatechars:100 }}</p>
        </div>
        {% endfor %}
    </div>
{% endblock %}
