<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}">Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'catalog:home' %}">Главная</a>
                <a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a>
            </div>
            <!-- Добавленные кнопки входа/регистрации (новый блок) -->
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-2">Привет, {{ user.email }}!</span>
                    <a class="btn btn-outline-danger" href="{% url 'logout' %}">Выйти</a>
                {% else %}
                    <a class="btn btn-outline-primary me-2" href="{% url 'login' %}">Войти</a>
                    <a class="btn btn-primary" href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
