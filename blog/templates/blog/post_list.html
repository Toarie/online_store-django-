{% extends 'catalog/base.html' %}

{% block content %}
<h1>Статьи блога</h1>
<a href="{% url 'blog:post_create' %}" class="btn btn-primary">Создать</a>
{% for post in posts %}
    <div class="post">
        <h2><a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a></h2>
        <p>Просмотров: {{ post.views_count }}</p>
    </div>
{% endfor %}
{% endblock %}
